function sl(arr, n) { return n > 0 ? arr.slice(-n) : [...arr]; }

const DATASETS = [
  { label: '% > SMA10',  key: 'p10',  color: '#60a5fa', width: 1.5, step: true  },
  { label: '% > SMA20',  key: 'p20',  color: '#fb923c', width: 1.5, step: false },
  { label: '% > SMA50',  key: 'p50',  color: '#34d399', width: 2.0, step: true  },
  { label: '% > SMA200', key: 'p200', color: '#f87171', width: 2.5, step: true  },
  { label: 'NIFTY MidSml 400 (norm.)', key: 'bench', color: '#a78bfa', width: 1, dash: [5,3], step: true  },
];

const MA_KEYS = { sma: ['p10','p20','p50','p200'], ema: ['e10','e20','e50','e200'] };
const MA_LABELS = {
  sma: ['% &gt; SMA10','% &gt; SMA20','% &gt; SMA50','% &gt; SMA200'],
  ema: ['% &gt; EMA10','% &gt; EMA20','% &gt; EMA50','% &gt; EMA200'],
};
let _useEma = true;  // EMA default

function activeKey(i) { return i < 4 ? MA_KEYS[_useEma ? 'ema' : 'sma'][i] : DATASETS[i].key; }

function makeDatasets(n) {
  return DATASETS.map((d, i) => ({
    label: i < 4 ? MA_LABELS[_useEma ? 'ema' : 'sma'][i] : d.label,
    data: sl(D[activeKey(i)], n),
    borderColor: d.color,
    borderWidth: d.width,
    borderDash: d.dash || [],
    pointRadius: 0,
    stepped: d.step ? 'middle' : false,
    tension: d.step ? 0 : 0.1,
    fill: false,
    spanGaps: true,
    hidden: [1, 2].includes(i),
  }));
}

let currentRange = 90;
const stepState = DATASETS.map(d => d.step);
const ctx = document.getElementById('bc').getContext('2d');

// Reference line plugin
const refPlugin = {
  id: 'refLines',
  afterDraw(chart) {
    const { ctx: c, chartArea: { left, right }, scales: { y } } = chart;
    if (!y) return;
    const lines = [
      { v: 80, color: 'rgba(52,211,153,0.45)',  label: '80%', lc: '#34d399' },
      { v: 50, color: 'rgba(255,255,255,0.18)', label: '50%', lc: '#888'    },
      { v: 20, color: 'rgba(248,113,113,0.45)', label: '20%', lc: '#f87171' },
    ];
    c.save();
    lines.forEach(({ v, color, label, lc }) => {
      const py = y.getPixelForValue(v);
      c.setLineDash([4, 4]);
      c.strokeStyle = color;
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(left, py); c.lineTo(right, py); c.stroke();
      c.setLineDash([]);
      c.fillStyle = lc;
      c.font = '10px Segoe UI';
      c.fillText(label, left + 5, py - 3);
    });
    c.restore();
  }
};
Chart.register(refPlugin);

const chart = new Chart(ctx, {
  type: 'line',
  data: { labels: sl(D.dates, 90), datasets: makeDatasets(90) },
  options: {
    responsive: true,
    animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1e2130',
        titleColor: '#ccc',
        bodyColor: '#aaa',
        borderColor: '#3a3d4e',
        borderWidth: 1,
        callbacks: {
          label: ctx => {
            const v = ctx.parsed.y;
            return ` ${ctx.dataset.label}: ${v != null ? v.toFixed(1) + '%' : 'N/A'}`;
          },
        },
      },
    },
    scales: {
      x: {
        grid: { color: 'rgba(255,255,255,0.04)' },
        ticks: { color: '#555', maxTicksLimit: 12, maxRotation: 0 },
      },
      y: {
        min: 0, max: 100,
        grid: { color: 'rgba(255,255,255,0.04)' },
        ticks: { color: '#555', callback: v => v + '%' },
      },
    },
  },
});

function setRange(n) {
  currentRange = n;
  ['60','90','180','252','all'].forEach(k => document.getElementById('btn-' + k).classList.remove('active'));
  document.getElementById(n === 0 ? 'btn-all' : 'btn-' + n).classList.add('active');
  chart.data.labels = sl(D.dates, n);
  DATASETS.forEach((d, i) => { chart.data.datasets[i].data = sl(D[activeKey(i)], n); });
  chart.update('none');
  updateStats(n);
}

function toggleStep(i) {
  stepState[i] = !stepState[i];
  const step = stepState[i];
  chart.data.datasets[i].stepped = step ? 'middle' : false;
  chart.data.datasets[i].tension = step ? 0 : 0.1;
  const btn = document.getElementById('style-' + i);
  if (btn) { btn.textContent = step ? 'Step' : 'Line'; }
  chart.update('none');
}

let _allStep = false;
function toggleAllStep() {
  _allStep = !_allStep;
  DATASETS.forEach((d, i) => {
    stepState[i] = _allStep;
    chart.data.datasets[i].stepped = _allStep ? 'middle' : false;
    chart.data.datasets[i].tension = _allStep ? 0 : 0.1;
    const btn = document.getElementById('style-' + i);
    if (btn) { btn.textContent = _allStep ? 'Step' : 'Line'; }
  });
  const ab = document.getElementById('btn-allstep');
  if (ab) { ab.textContent = _allStep ? 'All Line' : 'All Step'; }
  chart.update('none');
}

function toggleSmaEma() {
  _useEma = !_useEma;
  const mode = _useEma ? 'ema' : 'sma';
  DATASETS.forEach((d, i) => {
    chart.data.datasets[i].data = sl(D[activeKey(i)], currentRange);
    if (i < 4) {
      chart.data.datasets[i].label = MA_LABELS[mode][i];
      const sp = document.getElementById('lbl-' + i);
      if (sp) sp.innerHTML = MA_LABELS[mode][i];
    }
  });
  const btn = document.getElementById('btn-smaema');
  if (btn) { btn.textContent = _useEma ? 'SMA' : 'EMA'; btn.classList.toggle('active', _useEma); }
  updateStats(currentRange);
  chart.update('none');
}

function toggleLine(i) {
  chart.data.datasets[i].hidden = !chart.data.datasets[i].hidden;
  const li = document.getElementById('li-' + i);
  if (li) li.classList.toggle('dim', chart.data.datasets[i].hidden);
  chart.update('none');
}

function updateStats(n) {
  const labels = sl(D.dates, n);
  const last = labels[labels.length - 1];
  const idx = D.dates.indexOf(last);
  const mode = _useEma ? 'ema' : 'sma';
  const statKeys = _useEma ? ['e10','e20','e50','e200'] : ['p10','p20','p50','p200'];
  const cards = [
    { label: mode.toUpperCase() + '10',  val: D[statKeys[0]][idx], cls: 'blue'   },
    { label: mode.toUpperCase() + '20',  val: D[statKeys[1]][idx], cls: 'orange' },
    { label: mode.toUpperCase() + '50',  val: D[statKeys[2]][idx], cls: 'green'  },
    { label: mode.toUpperCase() + '200', val: D[statKeys[3]][idx], cls: 'red'    },
  ];
  document.getElementById('stat-cards').innerHTML = cards.map(c => `
    <div class="stat">
      <div class="stat-label">% Above ${c.label} &nbsp;(${last})</div>
      <div class="stat-val ${c.cls}">${c.val != null ? c.val.toFixed(1) + '%' : 'N/A'}</div>
    </div>`).join('');
}

// Initialize dim state for datasets hidden by default
DATASETS.forEach((_, i) => {
  if (chart.data.datasets[i].hidden) {
    const li = document.getElementById('li-' + i);
    if (li) li.classList.add('dim');
  }
});

updateStats(90);
</script>
