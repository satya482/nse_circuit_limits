M", "conviction": "High", "summary": "Urban Company initiates at BUY with March 2027 target of INR 125 (16% upside). The company operates a monopolistic multi-category home services marketplace in India and international markets with 60%+ share in a largely unorganised INR 5tn TAM. Strong network effects, superior professional economics, and replicable international playbook support 31% FY25-28E revenue CAGR with EBITDA margin inflection, while Native products and InstaHelp offer significant optionality.", "connection_narrative": "The Indian home services industry stands at an inflection point driven by three structural forces reshaping the sector. First, rapid urbanisation and formalisation of the gig economy are elevating service professional expectations around earnings stability, training, and legitimacy—a shift that online platforms uniquely address through standardised supply chains and algorithmic matching. Second, rising household incomes in tier-1 and tier-2 cities are creating demand for convenient, trustworthy service delivery, breaking the historical reliance on informal networks and word-of-mouth recommendations that characterise the 91% unorganised market. Third, the success of quick commerce and hyperlocal marketplaces has created consumer habit formation around on-demand instant gratification, directly applicable to home services. Urban Company captures all three tailwinds as a monopolistic multi-category player with 60-plus percent market share in a sub-one percent penetrated market. The company's defensibility stems from prohibitive network effects—each new service category strengthens the platform for existing professionals and customers while simultaneously creating switching costs. Service professionals earn INR 28,000 to 51,000 monthly net earnings, three times higher than unorganised peers, making Urban Company their preferred channel while customers benefit from centralised pricing, standardised training, and quality consistency previously un across 20+ countries, JAINREC is well-positioned to capitalize on accelerating secondary metal demand driven by mining constraints, sustainability imperatives, and favorable regulatory policies.", "connection_narrative": "The global recycling and circular economy narrative has become structurally relevant because of three converging forces: first, major global copper mines are experiencing production disruptions that are tightening primary copper supply at a time when demand from power transmission, infrastructure, and clean energy sectors remains robust, creating a significant supply-demand gap. Second, India's domestic secondary lead demand is accelerating at 6.5% CAGR driven by expanding lead-acid battery consumption from rising vehicle adoption and telecom infrastructure buildout, while secondary copper demand is expected to surge at 14% CAGR as global mining constraints bite. Third, regulatory policies across India are actively formalizing the recycling sector by pushing out unorganized players, with approximately 60% of the market still held by informal operators, creating a structural opportunity for organized recyclers to consolidate market share through superior technology, compliance, and supply chain capabilities. Jain Resource Recycling specifically benefits from these three themes through its integrated platform that combines multiple materials in a single location, allowing for cost-efficient processing and value extraction. The company's lead recycling segment, which contributes 44% of revenue, is poised to grow at 25% volume CAGR as it captures formalization-driven demand, while simultaneously moving up the value chain by extracting higher-value by-products like antimony and tin, which should expand EBITDA per metric ton from INR16,897 to INR21,067 by FY28. In copper, where JAINREC generates 50% of revenue despite only 21% of volume, the company's competitive edge lies in its integrated global sourcing network spanning 120+ countries with 71% direct procurement from overseas scrapyards, eliminating intermediary costs and ensuring both supply security and cost advantage. The company's strategic forward integration into value-added copper products such as cathodes, wire rods, and busbars is expected to generate EBITDA per metric ton growth from INR32,903 to INR48,246 by FY28, materially enhancing margins. Capacity expansion from 184K MT to 300K MT in lead and 83K MT to 100K MT in copper by FY28 positions the company to capture both the formalization-driven consolidation and the global supply deficit-driven demand acceleration. The single most important catalyst to monitor is the successful commercialization and scaling of antimony extraction capabilities from lead-acid battery recycling, as this niche metallurgical process creates strong competitive moats and significantly higher realizations per metric ton. The key risk to the thesis is a potential slowdown in global copper mine supply disruptions, which could ease the secondary copper supply-demand dynamics and compress premiums that currently support high margins in the recycled copper business."}, {"date": "2026-05-13", "source": "nbfc msme impact.pdf", "themes": ["Iran War Impact on Fuel Supply", "NBFC Sector Headwinds", "Rising Cost of Funds", "MSME Stress", "Vehicle Loan Portfolio Risk"], "companies": [{"symbol": "BAJAJFINSV", "name": "Bajaj Finance", "sentiment": "bullish", "nse_code": "BAJAJFINSV", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "CIFC", "name": "CIFC", "sentiment": "neutral", "nse_code": "IRFC", "res_conf": 0.75, "res_method": "fuzzy_symbol"}, {"symbol": "SHFL", "name": "Shriram Finance", "sentiment": "bullish", "nse_code": "SHRIRAMFIN", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "MMFS", "name": "Mahindra & Mahindra Financial Services", "sentiment": "bullish", "nse_code": "M&MFIN", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "LTF", "name": "L&T Finance", "sentiment": "bullish", "nse_code": "LTF", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "PFC", "name": "Piramal Finance", "sentiment": "bullish", "nse_code": "PFC", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "TATACAPITAL", "name": "Tata Capital", "sentiment": "bullish", "nse_code": "TATACAP", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "HDBFS", "name": "HDB Financial Services", "sentiment": "neutral", "nse_code": "HDBFS", "res_conf": 1.0, "res_method": "exact"}], "key_points": ["Iran war causing fuel supply shock threatens NBFC credit quality in business, MSME, and vehicle loan segments", "MSME-focused NBFCs face immediate risk from widespread operational disruptions across ceramic, textile, automotive, and engineering sectors", "Vehicle loan segment challenged by dual impact of fuel price hikes and reduced economic activity/freight movement", "Cost of funds pressure mounting with 3Y/5Y AAA NBFC yields up 61-68bps YTD; diversified and housing NBFCs better positioned with higher floating rate assets", "Government excise duty cut of INR10/litre provides temporary relief until state elections end-April, after which fuel price hikes expected if crude remains above USD90/bbl", "India maintains 74 days of crude and product reserves including SPR; LPG supply showing early signs of improvement with more Indian vessels allowed through Strait of Hormuz", "Housing and gold loan segments show lesser asset quality concerns compared to business and MSME segments"], "catalysts": ["Retail fuel price hikes post-state elections (end-April 2026)", "Crude oil price trajectory above USD90/bbl", "MSME credit cost deterioration from 1Q27", "Iran war resolution or escalation", "NBFC disbursement slowdown decisions", "Vehicle freight rate movements and economic activity indicators"], "time_horizon": "6-12M", "conviction": "High", "summary": "The Iran war-induced fuel supply shock poses significant headwinds for Indian NBFCs, with business, MSME, and vehicle loan segments facing elevated credit risk from operational disruptions and potential fuel price hikes post-April 2026 state elections. While India maintains comfortable crude reserves and cost of funds pressure mounts, diversified and housing-focused NBFCs with higher floating rate assets are better positioned to weather the volatility than MSME-focused lenders facing immediate portfolio stress.", "connection_narrative": "The Iran war represents a critical structural shock to India's energy supply chain that is unfolding in real-time with immediate operational consequences for NBFC portfolios. What makes this cyclically significant is the confluence of three factors: first, India's fuel supply constraints are hitting MSME-dependent industrial clusters across Gujarat, Maharashtra, Jharkhand, Tamil Nadu, and Odisha simultaneously; second, the government's excise duty cut provides only temporary political cover until end-April state elections, after which diesel price hikes of approximately INR10 per litre are expected if crude remains above USD90 per barrel; and third, NBFC funding costs have already risen 61-68 basis points year-to-date on 3-5 year AAA bonds, constraining profitability across the sector. Business and MSME loans representing 24 percent of total NBFC credit are facing immediate stress as multiple industrial sectors report shutdowns, labor shortages, and operational cost explosions. Vehicle financiers face a particularly acute challenge because the segment has benefited from three post-COVID tailwinds—steady diesel prices, healthy freight rates, and strong economic activity—all of which are now reversing simultaneously. For new truck operators, reduced trip volumes cut net income from INR181,000 to INR26,000 monthly, while fixed EMI obligations remain unchanged, creating acute debt servicing pressure. Among the covered NBFC universe, diversified and housing-focused lenders such as Bajaj Finance, Shriram Finance, Mahindra & Mahindra Financial Services, and L&T Finance carry higher floating-rate asset books that provide natural hedges against rising funding costs, positioning them to outperform MSME-focused peers who face simultaneous portfolio deterioration and margin compression. Housing and gold loan segments show materially lower asset quality risk exposure to fuel shocks given end-customer profiles insulated from commodity price volatility. The critical catalyst to monitor is the retail fuel price announcement expected within weeks after state elections conclude on April 29th, 2026; if crude prices persist above USD100 per barrel and the government allows prices to rise toward market levels, NBFC credit costs will spike immediately with 1Q27 showing measurable asset quality deterioration. The key risk remains geopolitical escalation in the Iran war itself, which could trigger energy lockdowns despite India's currently comfortable 74-day reserve position."}, {"date": "2026-05-13", "source": "Nomura - Mar 12 - India NBFC - The Challengers.pdf", "themes": ["NBFC Growth and Market Share Expansion", "AI-Driven Lending Transformation", "Retail Credit Penetration", "Regulatory Framework Development", "Diversification into High-Yield Products"], "companies": [{"symbol": "PIRAMALF", "name": "Piramal Finance", "sentiment": "bullish", "nse_code": "PIRAMALFIN", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "LTF", "name": "L&T Finance", "sentiment": "bullish", "nse_code": "LTF", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "TATACAP", "name": "Tata Capital", "sentiment": "bullish", "nse_code": "TATACAP", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "HDBFS", "name": "HDB Financial Services", "sentiment": "neutral", "nse_code": "HDBFS", "res_conf": 1.0, "res_method": "exact"}], "key_points": ["NBFCs expected to grow at 17% CAGR (FY25-35F) vs 12% for banks, expanding market share from 21% to 33% by FY41F", "India's credit-to-GDP ratio significantly below developed economies at 70% (FY25), offering long runway for credit growth to 114% by FY41F", "AI adoption in lending could transform underwriting efficiency and customer identification, particularly for high-intensity products like microfinance and two-wheeler financing", "Senior bankers transitioning to NBFCs (e.g., Piramal CFO from Axis, LTF CEO from ICICI) bringing institutional expertise and execution capabilities", "Retail credit represents 68-70% of NBFC portfolios (ex-power), with gold loans (5% ROA) and MSME loans (4% ROA) offering attractive risk-adjusted returns", "Piramal, LTF, Tata Capital expected to deliver 20%+ loan growth CAGRs and mid-teen+ ROEs by FY28F"], "catalysts": ["RBI's AI framework implementation in financial sector (guidelines released Aug 2025)", "MSME credit penetration expansion (currently 7-8% of bank credit)", "Gold loan market intensification and market share gains", "Consumer durables lending growth beyond Bajaj Finance dominance", "Execution of diversification strategies by management teams with banking backgrounds", "Credit-to-GDP expansion as India economy matures"], "time_horizon": "2Y+", "conviction": "High", "summary": "Nomura initiates coverage of four upper-tier NBFCs with Buy ratings on Piramal Finance, L&T Finance, and Tata Capital, driven by structural growth tailwinds in India's underpenetrated credit market and AI-led operational transformation. NBFCs are positioned to capture disproportionate credit growth as the sector's share expands from 21% to 33% by FY41F, with industry-experienced management teams executing diversification into high-return retail segments. The analysts project these three companies to achieve 20%+ loan growth CAGRs and mid-teen ROEs by FY28F, supported by India's credit-to-GDP ratio still below 70% with potential to reach 114% by FY41F.", "connection_narrative": "India's credit-to-GDP ratio of 70% sits significantly below developed economies at 150-200%, creating a structural long-term tailwind for credit expansion as the economy matures and financial inclusion deepens. The NBFC sector is positioned to capture a disproportionate share of this credit growth opportunity, with the RBI's August 2025 committee report on AI adoption establishing guiding principles for the industry's technological transformation. Simultaneously, there is a notable regulatory gap that will likely be filled as the RBI develops comprehensive AI frameworks, creating near-term uncertainty but long-term clarity for compliant lenders. The emergence of AI engines capable of analyzing alternative data sources and the transition of senior bankers from traditional banking to NBFCs represent a fundamental shift in competitive dynamics, particularly in high-intensity products like microfinance, two-wheeler financing, and MSME lending where underwriting efficiency and customer identification are paramount. Piramal Finance has executed rapid retail-ization of its loan portfolio under new CFO leadership from Axis Bank, positioning it to capitalize on gold loans and MSME segments where ROAs exceed 4-5%. L&T Finance, led by a former ICICI Bank executive, has strategically exited wholesale segments while expanding granular retail presence, targeting 20%+ loan growth with improved risk-adjusted returns. Tata Capital combines mature market presence with focused expansion in high-return segments, particularly SME and consumer finance where its existing infrastructure provides competitive advantage. The critical near-term catalyst is the RBI's implementation timeline and specific guardrails for AI-based lending, as compliance-ready lenders could gain significant competitive advantage in automation and prime customer targeting. The primary risk to thesis execution is that intensifying competition in newly attractive segments like gold loans could compress spreads and ROAs below current projections, particularly if larger players like Bajaj Finance aggressively enter traditionally NBFC-dominated segments."}, {"date": "2026-05-13", "source": "NTPC Green - IC - HSIE-202603171036475563059.pdf", "themes": ["Renewable Energy Expansion", "India Energy Demand Growth", "Energy Storage Systems", "Government Policy Support"], "companies": [{"symbol": "NTPCGREE", "name": "NTPC Green Energy Ltd", "sentiment": "bullish", "nse_code": "NTPCGREEN", "res_conf": 0.97, "res_method": "name_exact"}], "key_points": ["NGEL initiating coverage with BUY rating and target price of INR 121, implying 22% upside from CMP of INR 99", "Strong operational portfolio of 8GW renewable capacity with 32.6GW total portfolio including pipeline and MoU projects", "Revenue and EBITDA expected to grow at 82% CAGR from FY26E to FY29E, reaching INR 147.1bn", "Significant capacity expansion roadmap from 8GW current to 60GW by FY32 aligned with India's 500GW renewable target by FY30", "NGEL benefits from NTPC's 50+ years execution expertise, PSU status for lower financing costs, and 2.5 lakh acre land bank", "Emerging demand drivers including data centers, pumped storage projects, and battery energy storage systems creating growth optionality", "Valuation at 14.5x FY29 EV/EBITDA based on SOTP methodology with 12% discount rate"], "catalysts": ["Contracted and awarded 15.5GW capacity operationalization through FY29", "New demand from data centers and pumped storage projects pushing solar requirement beyond 35GW annually", "Battery energy storage system cost reductions enabling solar plus BESS deployment", "Land availability and transmission connectivity advantages vs peers enabling faster project execution", "Ayana Renewables acquisition driving inorganic growth in commercial and industrial segment"], "time_horizon": "2Y+", "conviction": "High", "summary": "NTPC Green Energy is initiating coverage with a BUY rating and INR 121 target price, driven by a compelling growth narrative anchored in India's accelerating renewable energy expansion. With a strong operational base of 8GW and a 32.6GW portfolio across operational, contracted, and pipeline stages, NGEL is positioned to achieve 82% revenue and EBITDA CAGR through FY29, benefiting from NTPC's execution excellence and lower PSU financing costs. Emerging demand catalysts from data centers and energy storage systems offer significant upside optionality beyond base case projections.", "connection_narrative": "India's renewable energy sector is at an inflection point driven by three structural forces: first, the government's commitment to 500GW renewable capacity by 2030 creates a massive policy tailwind for large developers, second, India's rising population and GDP growth trajectory of 7-8% CAGR is expected to increase power consumption with 0.9-1.1x elasticity to GDP growth, and third, emerging demand from data centers and pumped storage projects is creating incremental solar requirements that significantly exceed traditional projections of 35GW annual capacity addition. NTPC Green Energy, the renewable arm of India's largest thermal power generator, is structurally positioned to capture this opportunity through multiple competitive advantages. As a CPSE subsidiary, NGEL enjoys access to the lowest-cost capital and strong relationships with state governments, utilities, and financial institutions that are critical for executing large-scale projects, advantages that are particularly pronounced for renewables which have become the policy favorite asset class globally. The company's 2.5 lakh acre land bank concentrated in solar-rich states of Rajasthan and Gujarat, combined with already-secured transmission connectivity for its entire portfolio, removes the two most critical execution bottlenecks that typically plague renewable developers, enabling faster project ramp-up at higher margins. NGEL's parent NTPC brings 50 years of large infrastructure execution experience that directly translates to lower construction costs and faster project ramp-ups, while the company's aggressive guidance of 5GW, 8GW, 8GW, and 8GW annual capacity additions in FY26-29 is backed by real PPAs and contracted awards of 15.5GW. Beyond traditional utility-scale renewables, NGEL is well-positioned for new energy frontiers: the emerging data center boom in India requires 3.5-4.5GW of dedicated solar plus battery storage capacity per gigawatt of IT load, while pumped storage projects need 6-7GW of solar or hybrid renewable capacity per gigawatt of round-the-clock delivery, and battery energy storage system costs are falling rapidly making these integrated solutions economically viable. The most critical catalyst to watch is the pace of contracted capacity operationalization and the incremental capacity wins from data center and pumped storage project tenders, both of which could push NGEL's growth materially above management guidance and drive significant multiple expansion from the current 14.5x EV/EBITDA. The primary risk is execution delays on joint venture projects, aggressive competitive bidding that pressures tariffs, or delays in power transmission connectivity activation, all of which could compress margins and delay the company's path to 60GW by 2032."}, {"date": "2026-05-13", "source": "Nuvama.pdf", "themes": ["GLP-1 Weight Loss Drugs", "Pharmaceutical Manufacturing & CDMOs", "Generic Drug Expansion", "Indian Obesity Market Growth", "Global Obesity Epidemic"], "companies": [{"symbol": "LILLY", "name": "Eli Lilly", "sentiment": "bullish", "nse_code": null, "res_conf": 0.0, "res_method": "unresolved"}, {"symbol": "NVO", "name": "Novo Nordisk", "sentiment": "bullish", "nse_code": null, "res_conf": 0.0, "res_method": "unresolved"}, {"symbol": "DRRD", "name": "Dr Reddy's Laboratories", "sentiment": "bullish", "nse_code": "DRREDDY", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "TRP", "name": "Torrent Pharmaceuticals", "sentiment": "bullish", "nse_code": "TORNTPHARM", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "BIOS", "name": "Biocon", "sentiment": "neutral", "nse_code": "BIOCON", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "SUNP", "name": "Sun Pharma", "sentiment": "neutral", "nse_code": "SUDEEPPHRM", "res_conf": 0.728, "res_method": "token_name"}, {"symbol": "DIVI", "name": "Divi's Laboratories", "sentiment": "bullish", "nse_code": "DIVISLAB", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "ONESOURC", "name": "OneSource", "sentiment": "neutral", "nse_code": "ONESOURCE", "res_conf": 0.941, "res_method": "fuzzy_symbol"}, {"symbol": "SHEP", "name": "Shepherd Pharma", "sentiment": "neutral", "nse_code": null, "res_conf": 0.0, "res_method": "unresolved"}], "key_points": ["GLP-1s have generated USD50bn+ in revenue and present USD175bn global opportunity by 2035", "Tirzepatide and retatrutide show 22-24% weight loss efficacy vs semaglutide's 21%", "Generic semaglutide injectable launches expected in 2026, unlocking emerging market access", "CDMO manufacturing opportunity valued at USD5-10bn globally at peak due to supply constraints", "India's obesity market growing from USD25bn (2025) to USD56bn (2033) with rising prevalence", "Eli Lilly positioned as potential GLP-1 market leader due to novel pipeline superiority", "Price cuts in US market driven by easing supply constraints and competition from compounding pharmacies", "Divi's Laboratories commencing GLP-1 component manufacturing in FY26 with potential client contracts"], "catalysts": ["Generic semaglutide injectable launch in 2026", "Oral GLP-1 formulation approvals", "US insurance coverage expansion for obesity indication", "Divi's commercial manufacturing commencement FY26", "Clinical data for GLP-1s in new indications (kidney disease, Alzheimer's, Parkinson's)", "CDMO capacity build-out completion", "Indian market adoption acceleration post-generic availability"], "time_horizon": "2Y+", "conviction": "High", "summary": "The GLP-1 weight-loss drug market represents a transformational USD175bn opportunity by 2035, driven by escalating global obesity prevalence. Supply constraints easing have triggered price competition, while generic semaglutide launches in 2026 will unlock emerging markets including India. Indian companies gain multi-faceted exposure through generic launches, CDMO manufacturing, and API production, with Divi's emerging as a key GLP-1 component supplier.", "connection_narrative": "The GLP-1 market explosion is structurally relevant now because obesity has become a global epidemic with 2.5 billion overweight adults in 2022, and GLP-1 efficacy—particularly tirzepatide at 22-24% weight loss—is driving unprecedented adoption that has already captured USD50bn in annual revenues. Policy support is strengthening as insurance coverage for obesity indications expands in developed markets, while manufacturing capacity constraints worldwide are forcing innovators to partner with CDMOs and creating USD40bn-plus in fresh capex opportunities. The Indian market specifically is at an inflection point where rising obesity prevalence—expected to grow from 180 million overweight adults in 2025 to 450 million by 2050—combined with generic semaglutide availability from 2026 creates a domestic opportunity expanding from USD25bn to USD56bn by 2033. Eli Lilly benefits from superior efficacy data for tirzepatide and retatrutide while maintaining pricing power in developed markets where insurance support is expanding. Divi's Laboratories is positioned as a critical GLP-1 component manufacturer, beginning commercial production of FMOC and BOC peptide components in FY26 with likely client contracts already signed, giving it decade-long revenue visibility in this high-margin specialty chemical space. Indian generic players like Dr Reddy's and Torrent expect sizable market share gains from semaglutide launches in Canada and Brazil respectively, while Sun Pharma's multi-year development timeline for proprietary GLP-1s carries longer execution risk. The single most important catalyst is generic semaglutide's 2026 global rollout—particularly in India—which will determine the speed of emerging market penetration and the relative success of each player. The key risk is that manufacturing complexity and supply chain dependencies could lead to persistent capacity constraints, limiting mass-market access and allowing high prices to persist longer, which would delay the USD175bn market realization and reduce generic player opportunity."}, {"date": "2026-05-13", "source": "oil & gas nomura.pdf", "themes": ["Excise duty policy impact on oil marketing companies", "Windfall tax on diesel and ATF exports", "Refining margin compression and relief measures", "Government fiscal intervention in energy markets"], "companies": [{"symbol": "IOCL", "name": "Indian Oil Corporation", "sentiment": "bullish", "nse_code": "OIL", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "BPCL", "name": "Bharat Petroleum Corporation", "sentiment": "bullish", "nse_code": "BPCL", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "HPCL", "name": "Hindustan Petroleum Corporation", "sentiment": "bullish", "nse_code": "HINDPETRO", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "RELIANCE", "name": "Reliance Industries", "sentiment": "neutral", "nse_code": "RELIANCE", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "OINL", "name": "Oil India", "sentiment": "bearish", "nse_code": "OIL", "res_conf": 0.97, "res_method": "name_exact"}], "key_points": ["INR10/liter excise duty cuts on petrol and diesel announced on 27 Mar 2026 to support OMCs facing losses", "IOCL, BPCL, HPCL to gain integrated GRM benefits of USD12.4/bbl, USD14.8/bbl, USD20.4/bbl respectively from excise duty cuts", "Windfall tax on diesel and ATF exports set at INR21.5/liter and INR29.5/liter respectively, adjusted fortnightly", "HPCL to benefit most from windfall tax (~USD11.7/bbl) due to 32% of throughput sourced from standalone refineries", "Reliance's SEZ refinery exempted from windfall tax but domestic refinery faces USD8.7/bbl GRM impact", "Oil India negatively impacted via NRL subsidiary facing USD32.5/bbl GRM compression from combined excise duty and windfall tax effects", "Fiscal impact of excise duty cuts estimated at INR1.65tn (0.45% of GDP)", "OMCs' net integrated margin impact: IOCL USD12.9/bbl, BPCL USD18.1/bbl, HPCL USD32.1/bbl"], "catalysts": ["Implementation of INR10/liter excise duty cuts on petrol and diesel", "Windfall tax fortnightly adjustments based on global crude prices", "ATF price hike expected on 1 April 2026", "Domestic refinery agreements with OMCs on transfer pricing for diesel and ATF post-windfall tax", "Government revenue impact and fiscal sustainability of duty cuts"], "time_horizon": "6-12M", "conviction": "High", "summary": "The Indian government announced significant excise duty cuts of INR10/liter on petrol and diesel effective 27 March 2026 to support oil marketing companies facing losses from elevated crude prices. Additionally, a windfall tax was introduced on diesel and ATF exports to disincentivize fuel exports during supply pressure. OMCs, particularly HPCL, are positioned to benefit substantially with integrated GRM improvements of USD12-32/bbl, while Reliance faces a USD8.7/bbl headwind and Oil India is negatively impacted through its subsidiary Numaligarh Refinery.", "connection_narrative": "The Indian government's excise duty cuts and windfall tax announcement on 27 March 2026 represent a major policy intervention driven by the structural challenge of maintaining retail fuel price stability amid elevated global crude oil prices. The sharp disconnect between rising international crude costs and administratively-controlled domestic retail prices has created significant losses for oil marketing companies that must absorb the margin compression. This policy cycle is now shifting toward direct support mechanisms for OMCs to prevent financial distress and ensure continued fuel availability across the economy. Simultaneously, the windfall tax on exports responds to global supply pressures by discouraging domestic refineries from exporting refined products at premium prices, ensuring domestic fuel security and allowing OMCs to source at better prices. Indian Oil Corporation benefits most directly from the excise duty relief given its 51 percent marketing volume exposure to diesel and diversified refining operations that provide integrated margin protection. Bharat Petroleum gains USD18.1/bbl of integrated margin benefit with 59 percent diesel exposure and balanced business mix. Hindustan Petroleum emerges as the largest beneficiary with a combined USD32.1/bbl improvement, predominantly because 32 percent of its diesel throughput comes from standalone refineries that will pass through windfall tax benefits in lower transfer prices, creating a unique structural advantage. Reliance Industries faces an estimated USD8.7/bbl GRM headwind from the windfall tax on domestic refinery exports, though its dedicated SEZ export refinery remains exempt, and current realized GRM may still exceed pre-war levels of USD10-12/bbl due to persistent elevated product cracks. Oil India suffers material damage through its 70 percent stake in Numaligarh Refinery, which faces a catastrophic USD32.5/bbl combined impact from losing its 50 percent excise duty retention benefit and falling subject to the windfall tax, directly threatening one third of Oil India's valuation foundation. The single most important near-term catalyst to monitor is the implementation effectiveness and any government modifications to the windfall tax framework, particularly regarding Reliance's SEZ refinery exemption status and export refinery treatment, as any changes could materially alter the relative benefit distribution among refiners. The key structural risk remains whether these subsidized fuel prices and export disincentives prove fiscally unsustainable at an estimated INR1.65 trillion annual cost, potentially forcing policy reversal and creating valuation volatility."}, {"date": "2026-05-13", "source": "PL_Capital_Initiates_Coverage_on_Anthem_Biosciences_with_15%_UPSIDE.pdf", "themes": tides, lipids, oligonucleotides) serving innovator-focused pharmaceutical clients. The company benefits from secular growth in biotech outsourcing with a robust commercial portfolio projected to grow from $12bn to $22bn in end-market sales by CY29, supported by INR 10-12bn capex expansion. We initiate with BUY rating and 16% upside to INR 755 target, forecasting 21% revenue CAGR over FY26-28E.", "connection_narrative": "Global pharmaceutical outsourcing is accelerating as innovators increasingly shift complex drug development and manufacturing to specialized partners, particularly for advanced modalities and biologics. Regulatory frameworks favoring manufacturing quality and cost optimization, combined with biotechnology industry consolidation creating larger pipelines, are driving structural demand for integrated CRDMO capabilities. The GLP-1 market boom is creating incremental demand for specialty pharmaceutical ingredients and APIs, while patent cliff dynamics ensure sustained commercial manufacturing demand post FY30. Anthem Biosciences is uniquely positioned to capture these trends through its comprehensive platform spanning discovery, development and commercial manufacturing across five advanced modalities that competitors rarely offer in integrated form. Its customer base of innovator-focused pharmaceutical companies and emerging biotech firms provides exposure to blockbuster molecules in migraine, rheumatoid arthritis, hepatitis C and oncology, with four molecules recently commercialized and six more in late-stage development expected to drive manufacturing scale-up. The company's fermentation capabilities give it direct exposure to the GLP-1 API opportunity starting H2CY26, complementing its core CRDMO business and providing margin stability. Management's INR 10-12bn capex program over three years, including the new Unit IV facility focused on high-value peptides and APIs, ensures capacity matches the projected 23% CDMO revenue CAGR and positions the company to capture growing demand from both existing and new customers transitioning advanced molecules to commercialization. The most critical catalyst to monitor is the execution of Unit IV commissioning and the translation of the late-stage pipeline into meaningful manufacturing revenue, while the key risk remains customer concentration with top 10 clients representing 77% of revenue, creating vulnerability to any major customer program setback or portfolio adjustment."}, {"date": "2026-05-13", "source": "POWERIND_IC_21042026.pdf", "themes": ["Power Transmission Infrastructure", "HVDC Technology Adoption", "India Power Grid Modernization", "Renewable Energy Integration", "Data Centre Power Demand"], "companies": [{"symbol": "HITACHIENERGY", "name": "Hitachi Energy India Limited", "sentiment": "bullish", "nse_code": "POWERINDIA", "res_conf": 0.97, "res_method": "name_exact"}], "key_points": ["Hitachi Energy is market leader with 48% share of India's 33.5GW operational HVDC capacity", "Two mega HVDC projects (Khavda-Nagpur and Bhadla-Fatehpur, 6GW each) will drive FY27-FY30 revenue", "Rs 1 trillion HVDC pipeline expected to be awarded over next 2-3 years with only 3 global players capable", "Government targets HVDC capacity increase from 33.5GW to 66.75GW by FY32 under National Electricity Plan", "Strong capex of Rs 20 billion planned over 4-5 years for capacity expansion across power equipment", "End-user demand from data centres (31.7% CAGR), EV charging (24.6% CAGR), and telecom (10% CAGR) driving base business", "EPS expected to grow from Rs 225 in FY26E to Rs 466 in FY28E, representing 47.6% CAGR"], "catalysts": ["Award of Barmer-South Kalamb HVDC project (H2 FY27)", "Revenue recognition from Khavda-Nagpur project (FY29-30)", "Revenue recognition from Bhadla-Fatehpur project (FY29-30)", "Additional HVDC order wins in FY27 and FY28", "Capex completion for new manufacturing plants", "India-Sri Lanka subsea HVDC project award (FY28)", "International HVDC projects (India-Saudi Arabia, India-UAE)"], "time_horizon": "2Y+", "conviction": "High", "summary": "Hitachi Energy India is a dominant player in India's high-voltage direct current transmission market with commanding 48% market share of operational capacity. The company benefits from a structural tailwind driven by India's National Electricity Plan to double HVDC capacity by FY32 and a robust Rs 1 trillion near-term project pipeline, with only three global competitors possessing execution expertise. Strong earnings growth is expected from two mega projects already secured and growing demand from data centres, renewables, and EV charging infrastructure.", "connection_narrative": "India's power transmission infrastructure is at an inflection point driven by three converging macro forces: the government's National Electricity Plan mandate to double HVDC capacity from 33.5GW to 66.75GW by FY32 as part of broader grid modernization, the urgent need to integrate renewable energy from remote locations into the national grid which requires long-distance high-capacity transmission, and surging electricity demand from new-age consuming sectors particularly data centres which face AI-driven power intensity with peak demand projected to spike from 1.4GW in FY25 to 4.7GW by FY30. HVDC technology is the critical solution for these challenges as it enables efficient long-distance transmission with lower losses and the ability to connect asynchronous grids, but the extreme technical complexity of designing converter stations with advanced semiconductor devices, managing fault currents without natural zero-crossing points, and operating sophisticated control systems limits global competition to only three players: Hitachi Energy, GE Vernova T&D, and Siemens Energy, with the LCC technology segment restricted to just Hitachi and GE Vernova. Hitachi Energy India specifically benefits as the dominant market leader with 48% of India's operational HVDC capacity and a legendary track record spanning from the world's first HVDC project in 1954 to over 150GW of global installations, positioning it to capture disproportionate share of India's Rs 1.9 trillion HVDC investment pipeline through FY32 plus another Rs 1 trillion beyond. The company has already secured two massive 6GW HVDC projects—Khavda-Nagpur and Bhadla-Fatehpur—which will drive revenue recognition beginning FY29-FY30 and drive EPS growth of 47.6% CAGR through FY28, with additional order wins expected in FY27 and FY28 given the Rs 1 trillion near-term pipeline and management's execution pedigree. Beyond HVDC, the company's base business benefits from steady demand across utilities, railways, and critical infrastructure with capex of Rs 20 billion planned to expand localized manufacturing capacity in power transformers, traction transformers, and HVDC components, positioning it to serve the accelerating electrification cycle. The single most important catalyst to monitor is the award of the Barmer-South Kalamb project worth Rs 250 billion expected in H2 FY27, which would validate the company's ability to secure additional mega-projects and extend the growth runway well beyond FY28; conversely, the key risk is execution complexity and delays on the Khavda-Nagpur or Bhadla-Fatehpur megaprojects which could pressure timelines and margins if technical challenges emerge or supply chain disruptions occur."}, {"date": "2026-05-13", "source": "Shadowfax-IC-27Apr26_260430_100013.pdf", "themes": ["India Digital Commerce Growth", "Third-Party Logistics (3PL) Market Consolidation", "Quick Commerce & Hyperlocal Delivery Expansion", "Asset-Light Business Models", "D2C & High-Growth Segment Penetration"], "companies": [{"symbol": "SHADOWF", "name": "ShadowFax Technologies", "sentiment": "bullish", "nse_code": "SHADOWFAX", "res_conf": 0.97, "res_method": "name_exact"}, {"symbol": "DELHIVERY", "name": "Delhivery", "sentiment": "neutral", "nse_code": "DELHIVERY", "res_conf": 1.0, "res_method": "exact"}], "key_points": ["ShadowFax fastest-growing 3PL with market share surging from 8% in FY22 to 23% in H1FY26", "Revenue growth accelerating from 32% in FY25 to 67% in 9MFY26", "Asset-light model delivers 21x fixed asset turnover and superior RoCE trajectory reaching 86% by FY28E", "Exposure to high-growth segments: Meesho (31% CAGR), Quick Commerce (53% CAGR), Rapid Delivery (22% CAGR)", "26% revenue CAGR projected FY26-28E with EBITDA margins expanding to 5.8% by FY28E", "Strong positioning across express parcel, reverse logistics, hyperlocal and critical logistics", "Valuation at 25x FY28E EV/EBITDA represents 20% discount to Delhivery"], "catalysts": ["Amazon India volume ramp-up materialization", "D2C brand penetration acceleration", "Heavy shipment capability expansion", "Deeper geographic pin-code penetration", "Market share gains in reverse logistics and quick commerce"], "time_horizon": "2Y+", "conviction": "High", "summary": "ShadowFax Technologies is initiating with a BUY recommendation and 12-month price target of INR 180 (19% upside). The company is the fastest-growing 3PL in India with market share expanding to 23% and strong positioning across express parcel, quick commerce, and hyperlocal logistics. Its asset-light model combined with exposure to high-growth segments positions it as an attractive proxy for India's digital commerce boom.", "connection_narrative": "India's digital commerce ecosystem is experiencing structural acceleration driven by rising e-commerce penetration currently at only 7% of retail, expanding quick commerce adoption, and D2C brand proliferation across high-growth categories like beauty and fashion. This macro tailwind is simultaneously triggering consolidation in the 3PL sector as platforms seek reliable, technology-enabled partners to manage increasingly complex logistics operations including rapid same-day deliveries and reverse logistics. ShadowFax captures this dual structural opportunity through its overindexation to the fastest-growing segments: it commands approximately 40% of Meesho's outsourced shipments (Meesho itself growing at 31% CAGR), 40% of quick commerce orders (projected 53% CAGR growth), and 75% of rapid delivery volumes for platforms like Nykaa and Myntra (22% CAGR). The company's asset-light operating model—owning only critical automation and technology infrastructure while leasing warehousing and fleet—enables it to scale without capital intensity, delivering a projected return on invested capital exceeding 85% by FY28E, substantially superior to asset-heavy peers like Delhivery. This capital efficiency translates to a revenue CAGR of 26% through FY28E with expanding EBITDA margins benefiting from operating leverage and favorable mix shift toward higher-yield segments. The single most important catalyst to monitor is the materialization of volume ramp-up from Amazon India following already-completed onboarding, which could accelerate market share gains materially. The key risk remains sustained customer concentration—particularly dependence on Meesho and quick commerce platforms—which could constrain growth if these high-growth segments moderate unexpectedly or if large e-commerce players accelerate insourcing of logistics operations."}, {"date": "2026-05-13", "source": "Systematix_Initiating_Coverage_on_Bikaji_Foods_International,.pdf", "themes": ["Organized FMCG Snacking", "Distribution Network Expansion", "Portfolio Diversification", "Brand Strength and Pricing Power", "Margin Expansion"], "companies": [{"symbol": "BIKAJI", "name": "Bikaji Foods International Limited", "sentiment": "bullish", "nse_code": "BIKAJI", "res_conf": 1.0, "res_method": "exact"}], "key_points": ["India's third-largest organized ethnic snack food company with 8% market share", "19% FY20-FY25 sales CAGR and 29% earnings CAGR, outperforming industry by 10-11pp", "Current reach of 335k direct and 1.4mn total outlets vs 9mn+ potential snack food outlet base", "Ethnic snacks comprise 64% of sales; sweets 13% and western snacks 8% with robust expansion", "Expanding into adjacent categories (retail, QSR, frozen foods, bakery) via acquisitions", "FY25-FY28E sales CAGR 15% and EPS CAGR 22% projected", "Operating margins expanding 345bps over FY25-FY28E with capacity utilization improvement from 50%", "Superior pack mix with 60% family packs vs smaller impulse packs driving richer realizations", "Planning 50,000 outlet additions annually to reach 500,000 direct outlets in 3 years", "Strong brand presence with celebrity endorsements and 2-2.5% A&P spending vs peers"], "catalysts": ["Domestic distribution network expansion in focus markets (UP, Punjab, Haryana, Delhi, Karnataka, Chhattisgarh)", "International expansion targeting to double sales over 3-4 years", "Adjacent category ramp-up (bakery, frozen foods, retail QSR)", "Capacity utilization improvement from 50% current levels", "Margin expansion from operational leverage and improved mix", "Market share gains from unorganized sector consolidation"], "time_horizon": "2Y+", "conviction": "High", "summary": "Bikaji Foods International is initiating coverage with a BUY rating and 22% upside target (Rs 750 vs Rs 616 CMP). The company is India's third-largest organized ethnic snack player with a proven track record of 19-29% FY20-FY25 sales-earnings CAGR, significantly outperforming industry growth. With only 335k direct outlets against a 9mn+ potential snack outlet base and 70% of sales concentrated in core markets representing just 15-16% of national snack outlets, BIKAJI has substantial runway for volume-led growth through planned distribution expansion of 50,000 outlets annually.", "connection_narrative": "India's organized snack food sector is expanding at 9-10% annually as consumer premiumization and distribution consolidation accelerate, with unorganized players gradually losing share to branded, organized competitors. Bikaji sits at the intersection of this structural consolidation trend and favorable consumption patterns where branded, convenient ethnic snacks command pricing power despite inflationary input cycles. The company's core markets of Rajasthan, Assam and Bihar have established brand equity with 45-60% market share in organized ethnic snacks, but these geographies represent only 15-16% of India's total snack outlet universe, creating massive expansion opportunity. Bikaji's strategic thrust into focus markets like Uttar Pradesh, Punjab, Karnataka and Chhattisgarh, where it currently maintains just 3-7% share, is compounding this opportunity—the company added 60,000 direct outlets in FY25 and plans sustained 50,000 annual additions going forward. Beyond distribution, Bikaji is strategically diversifying its portfolio through acquisitions in adjacent high-growth categories like frozen foods, bakery and retail QSR, which currently represent 8% of sales but carry significant medium-term value potential as they scale. The company's competitive moat derives from superior pack mix with 60% family packs commanding richer realizations versus peers, best-in-class brand building with 2-2.5% advertising spend, and demonstrated pricing power evidenced by sustained margin recovery during inflationary episodes—operating margins contracted initially in FY21-FY22 and 2HFY25 but rebounded sharply, reflecting consumer loyalty to the Bikaji brand. Manufacturing capacity utilization stands at just 50%, setting up a low-capex, high-free-cash-flow phase through FY26-FY28 where margin expansion of 345 basis points is projected as utilization improves. The single most critical catalyst is the pace of distribution expansion in focus markets—if Bikaji sustains 50,000 outlet additions annually while maintaining 13-15% volume growth and capturing market share from regional competitors, the FY25-FY28E sales CAGR of 15% and EPS CAGR of 22% are achievable. The primary downside risk is competitive intensity from unorganized regional players and other organized snack companies like Prataap Snacks intensifying promotional activity, which could pressure margins and growth if Bikaji's pricing power erodes."}, {"date": "2026-05-13", "source": "Systematix_Initiating_Coverage_on_Bluestone_Jewellery_and_Lifestyle.pdf", "themes": ["Studded jewellery growth", "Lifestyle-led consumption", "Omnichannel retail", "Organized retail penetration", "Digital-native commerce", "Premiumization", "Design-led differentiation"], "companies": [{"symbol": "BLUESTON", "name": "Bluestone Jewellery and Lifestyle Ltd", "sentiment": "bullish", "nse_code": "BLUESTONE", "res_conf": 0.97, "res_method": "name_exact"}], "key_points": ["Studded jewellery segment growing at 22-24% CAGR (2024-2029) vs 12-14% for broader jewellery market", "~68% of BLUESTON revenue from diamond-studded jewellery with superior GMROI and pricing power", "70-90% of in-store purchases digitally influenced; omnichannel flywheel with 299mn unique digital sessions in FY25", "300+ stores expanding at 21.5% CAGR through FY28E; 70-75 annual store addition runway across Tier-1/2/3 cities", "Approaching earnings inflection: EBITDA positive, targeting 8.6% EBITDA margin (pre-Ind AS) by FY28E and 18% RoIC by FY30E", "75% in-house manufacturing with vertically integrated CoCo model supporting margin expansion", "Mature store cohorts demonstrating ~24% EBITDA margin; FY26-28E revenue CAGR of 32.2%", "Organized retail penetration expected to rise from 37% to 44-47% by 2029; studded segment market to reach ~Rs 3.6trn"], "catalysts": ["Store cohort maturation and operating leverage realization", "Organized retail penetration gains from 37% toward 44-47%", "EBITDA margin expansion toward 8.6% (FY28E) and sustained growth", "Tier-2/3 city penetration driving revenue growth", "RoIC expansion to 18% by FY30E as advertising intensity moderates"], "time_horizon": "2Y+", "conviction": "High", "summary": "BLUESTON is initiating coverage with a BUY rating and Rs 644 target price (30x Mar 2028E pre-Ind AS EBITDA). The company is positioned at the structural intersection of India's jewellery market shift from investment-led gold to design-driven studded jewellery, with the studded segment growing 22-24% CAGR through 2029. BLUESTON's omnichannel model, vertical integration, and 300+ store network with significant expansion runway provide multiple levers for margin expansion and return ratio improvements as the business transitions from investment phase to scalable profitability.", "connection_narrative": "India's jewellery market is experiencing a decisive structural transformation driven by rising millennial and Gen Z aspirations for lifestyle-led, occasion-based accessories rather than investment-grade metal holdings. This shift is underpinned by increasing disposable incomes, urbanization, and a formalization wave wherein organized retail is expanding from 37% penetration today toward 44-47% by 2029. The studded jewellery segment, anchored in design-first differentiation rather than commodity gold pricing, is capturing this trend with a projected 22-24% CAGR through 2029—nearly double the broader 12-14% market growth—while daily-wear and occasion-led jewellery categories grow at 15-21% annually. Bluestone Jewellery and Lifestyle is structurally positioned as a primary beneficiary of this formalization and premiumization wave. The company derives nearly two-thirds of its revenue from diamond-studded jewellery—precisely the high-margin, fast-turning segment capturing consumer preference shifts—and has architected a proprietary omnichannel flywheel that seamlessly integrates 70-90% digitally-influenced discovery with rapid physical store expansion. With 300+ stores and a proprietary tech stack enabling pin-code-level inventory optimization, Bluestone combines data-led precision with experiential retail trust in a way that creates formidable barriers to entry against commodity-led competitors. The company's vertical integration—with 75% of manufacturing in-house and a largely company-owned store network—locks in margin expansion potential as store cohorts mature. Mature store cohorts already demonstrate ~24% EBITDA margins, signaling the inherent profitability of the model once it scales; Blueston forecasts EBITDA margin expansion toward 8.6% (pre-Ind AS basis) by FY28E and RoIC approaching 18% by FY30E as advertising intensity moderates and inventory turns improve. The company possesses a runway to add 70-75 stores annually through FY28E across both densified Tier-1 markets—where cities like Mumbai and Bengaluru still offer significant headroom—and underserved Tier-2/3 cities experiencing rising lifestyle aspirations. The single most critical catalyst to monitor is the realization of operating leverage and EBITDA margin expansion as mature store cohorts drive throughput improvements across fixed cost lines; evidence of this leverage unlocking should trigger a meaningful re-rating toward the 30x pre-Ind AS EBITDA target multiple. The primary risk is execution risk on store unit economics or slowdown in the studded jewellery adoption cycle if consumer preferences shift unexpectedly or macroeconomic headwinds compress discretionary spending faster than anticipated."}, {"date": "2026-05-13", "source": "20260513_1503.pdf", "themes": ["E-commerce", "Quick Commerce", "B2B E-commerce", "Food Delivery", "Travel-tech", "New-age Logistics", "Ed-tech", "Auto-tech", "Mobility", "Media", "Prop-tech", "Co-working Space", "Ad-tech", "Gaming", "Online Classifieds", "Enterprise Tech/SaaS", "Agri-tech", "Online Ticketing", "Clean-tech", "Digital Infrastructure", "AI and Sovereign Platforms"], "companies": [{"symbol": "FLIPKART", "name": "Flipkart", "sentiment": "bullish", "nse_code": null, "res_conf": 0.0, "res_method": "unresolved"}, {"symbol": "AMAZON", "name": "Amazon", "sentiment": "bullish", "nse_code": null, "res_conf": 0.0, "res_method": "unresolved"}, {"symbol": "MEESHO", "name": "Meesho", "sentiment": "bullish", "nse_code": "MEESHO", "res_conf": 1.0, "res_method": "exact"}, {"symbol": "N y chains away from China", "Nasdaq Composite outpaced S&P 500 in every decade except 2000s dot-com collapse, supporting tech sector exposure thesis", "Identification of generational outliers crucial for alpha generation in New-Age Tech ecosystem"], "catalysts": ["Government policy support for digital infrastructure expansion", "AI infrastructure investments materializing", "Supply chain diversification from developed nations", "UPI transaction growth and ONDC adoption acceleration", "FTA trade agreements implementation", "Per capita income growth driving discretionary spending", "Mobile data consumption expansion", "Tech IPO listings of private companies"], "time_horizon": "2Y+", "conviction": "High", "summary": "This comprehensive thematic report analyzes India's New-Age Tech sector across 20 sub-segments and ~170 companies, positioning India as a generational investment opportunity at an inflection point structurally similar to China's 2006-12 boom. The convergence of India's per capita income reaching discretionary spending thresholds, government-backed digital infrastructure (UPI, ONDC), AI platform investments, and favorable supply chain diversification creates a lower-friction environment for tech adoption. The report emphasizes identifying generational outliers within India's emerging digital ecosystem as the ultimate prize for long-term investors.", "connection_narrative": "India stands at a critical juncture in its tech evolution, having narrowed its technology gap with China from a 20-year lag in the early 2010s to approximately 10 years today, with an even faster catch-up anticipated in the AI era. This acceleration is being driven by structural macro factors: India's per capita income has entered the same band that triggered China's discretionary spending boom from 2006 to 2012, when per capita income doubled and retail sales growth accelerated from 11 percent to 18 percent. Simultaneously, the government has constructed a sophisticated digital public in function tvLink(co) {
  // Use resolver-verified nse_code when confidence >= 0.60; fall back to raw symbol
  const conf = co.res_conf || 0;
  const sym  = (conf >= 0.60 && co.nse_code && co.nse_code !== 'null')
               ? co.nse_code
               : (co.symbol || '');
  if(!sym || sym === '—') return null;
  const clean = sym.replace(/\.(BO|NS|NSE|BSE)$/i,'').toUpperCase();
  if(!clean) return null;
  return `https://www.tradingview.com/chart/?symbol=NSE%3A${clean}`;
}

function confBadge(co) {
  const conf = co.res_conf || 0;
  const method = co.res_method || '';
  if(method === 'non_nse' || method === 'unresolved' || method === 'no_universe') return '';
  if(conf >= 0.85) return '<span class="res-badge res-ok" title="Exact/high-confidence NSE match">NSE</span>';
  if(conf >= 0.60) return '<span class="res-badge res-fz" title="Fuzzy NSE match">~NSE</span>';
  return '';
}

function convClass(c) {
  const l = (c||'').toLowerCase();
  if(l.includes('high'))   return 'conv-high';
  if(l.includes('medium')) return 'conv-med';
  return 'conv-low';
}

function sentClass(s) {
  const l = (s||'').toLowerCase();
  if(l.includes('bull')) return 'sent-bull';
  if(l.includes('bear')) return 'sent-bear';
  return 'sent-neu';
}

function renderSidebar(date) {
  const reports = ALL_DATA[date] || [];
  const el = document.getElementById('sidebar');
  if(!reports.length) { el.innerHTML='<div style="padding:20px;color:var(--mu);text-align:center">No reports</div>'; return; }

  let html = '<div class="sidebar-section">Themes</div>';
  reports.forEach((r, i) => {
    const themes = (r.themes||[]).join(', ') || 'Unknown';
    const shortTheme = themes.length > 32 ? themes.slice(0,30)+'…' : themes;
    const cos = (r.companies||[]).map(c=>{
      const conf = c.res_conf||0;
      return (conf>=0.60 && c.nse_code && c.nse_code!=='null') ? c.nse_code : (c.symbol||'—');
    }).join(', ') || '—';
    const shortCo = cos.length > 28 ? cos.slice(0,26)+'…' : cos;
    const color  = PALETTE[i % PALETTE.length];
    const cc     = convClass(r.conviction);
    const cls    = i === currentIdx ? 'theme-item active' : 'theme-item';
    html += `<div class="${cls}" onclick="selectTheme(${i})" style="border-left-color:${i===currentIdx?color:'transparent'}">
      <span class="theme-dot" style="background:${color}"></span>
      <div>

        <div class="theme-sub">${shortCo}</div>
      </div>
      <span class="badge theme-conv ${cc}">${r.conviction||'—'}</span>
    </div>`;
  });
  el.innerHTML = html;
}

    return (conf>=0.60 && c.nse_code && c.nse_code!=='null') ? c.nse_code : c.symbol;
  })));
  const highs   = reports.filter(r=>(r.conviction||'').toLowerCase().includes('high')).length;
  document.getElementById('stat-reports').textContent = reports.length;
  document.getElementById('stat-themes').textContent  = themes.size;
  document.getElementById('stat-cos').textContent     = cos.size;
  document.getElementById('stat-high').textContent    = highs;
}

function renderDateTabs() {
  const el = document.getElementById('date-tabs');
  el.innerHTML = ALL_DATES.map(d =>
    `<button class="date-tab${d===currentDate?' active':''}" onclick="switchDate('${d}')">${d}</button>`
  ).join('');
}

function isMobile() { return window.innerWidth <= 700; }

function showList() {
  document.getElementById('sidebar').classList.remove('mob-detail');
  document.getElementById('detail').classList.remove('mob-detail');
}

function showDetail() {
  if(isMobile()) {
    document.getElementById('sidebar').classList.add('mob-detail');
    document.getElementById('detail').classList.add('mob-detail');
    document.getElementById('detail').scrollTop = 0;
  }
}

function switchDate(date) {
  currentDate = date;
  currentIdx  = 0;
  renderDateTabs();
  renderSidebar(date);
  renderStats(date);
  renderDetail(date, 0);
  showList();
}

function selectTheme(idx) {
  currentIdx = idx;
  renderSidebar(currentDate);
  renderDetail(currentDate, idx);
  document.getElementById('detail').scrollTop = 0;
  showDetail();
}

// ── Day / Night theme toggle ─────────────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('tg_theme');
  if(saved === 'dark') {
    document.body.classList.add('dark');
    const btn = document.getElementById('theme-btn');
    if(btn) btn.textContent = '☀️ Day';
  }
})();

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️ Day' : '🌙 Night';
  localStorage.setItem('tg_theme', isDark ? 'dark' : 'light');
}

// ── Reader mode ──────────────────────────────────────────────────────────────
function _renderReportArticle(r, idx, date) {
  const CONV = {'high':'High Conviction','medium':'Medium Conviction','low':'Low Conviction'};
  const themes = (r.themes||[]).join(', ') || 'Unknown Theme';
  const thesis = r.connection_narrative || r.summary || '';
  const summary = r.connection_narrative ? (r.summary || '') : '';
  const kps  = r.key_points  || [];
  const cats = r.catalysts   || [];
  const cos  = r.companies   || [];
  const meta = [
    r.conviction ? CONV[(r.conviction||'').toLowerCase()] || r.conviction+' Conviction' : '',
    r.time_horizon ? 'Horizon: '+r.time_horizon : '',
    r.date || date,
  ].filter(Boolean).join(' | ');

  let coRows = cos.map(c => {
    const sent = (c.sentiment||'—').charAt(0).toUpperCase()+(c.sentiment||'—').slice(1);
    const sym  = (c.res_conf>=0.60 && c.nse_code && c.nse_code!=='null') ? c.nse_code : (c.symbol||'—');
    return `<tr><td><strong>${sym}</strong></td><td>${c.name||'—'}</td><td>${sent}</td></tr>`;
  }).join('');
  const coSection = cos.length ? `<section class="section"><h3 class="section-title">Companies</h3>
    <table class="co-table"><thead><tr><th>Symbol</th><th>Company</th><th>Sentiment</th></tr></thead>
    <tbody>${coRows}</tbody></table></section>` : '';

  const kpSection = kps.length ? `<section class="section"><h3 class="section-title">Key Points</h3>
    <ul class="kp-list">${kps.map(k=>`<li>${k}</li>`).join('')}</ul></section>` : '';

  const catSection = cats.length ? `<section class="section"><h3 class="section-title">Catalysts</h3>
    <ol class="catalyst-list">${cats.map(c=>`<li>${c}</li>`).join('')}</ol></section>` : '';

  return `<article class="reader-report">
    <header class="detail-header">
      <h2 class="detail-title" style="padding-left:12px;border-left:4px solid var(--blu)">${themes}</h2>
      <p style="color:#666;font-size:13px;margin:4px 0 12px">${meta}</p>
    </header>
    ${thesis ? `<div class="thesis-box"><div class="thesis-label">Investment Thesis</div>${thesis}</div>` : ''}
    ${summary ? `<div class="summary-box">${summary}</div>` : ''}
    ${coSection}${kpSection}${catSection}
  </article>`;
}

function toggleReaderMode() {
  const body = document.body;
  const btn  = document.getElementById('reader-btn');
  const isReader = body.classList.toggle('reader-mode');
  btn.classList.toggle('active', isReader);
  if(isReader) {
    const reports = ALL_DATA[currentDate] || [];
    const h1 = `<h1 style="font-size:24px;font-weight:700;margin-bottom:4px;color:#111">Telegram Equity Insights</h1>
      <p style="color:#666;font-size:14px;margin-bottom:28px">${currentDate} — ${reports.length} report${reports.length!==1?'s':''}</p>`;
    document.getElementById('detail-inner').innerHTML =
      h1 + reports.map((r,i)=>_renderReportArticle(r,i,currentDate)).join('');
    window.scrollTo(0,0);
  } else {
    renderDetail(currentDate, currentIdx);
  }
}

// Init
renderDateTabs();
renderSidebar(currentDate);
renderStats(currentDate);
renderDetail(currentDate, 0);
</script>
</body>
</html>
